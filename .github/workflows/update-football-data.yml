name: Update football database

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-football-data.yml'
      - 'scripts/build_datapack.py'
      - 'scripts/sync_live_squads.py'
      - 'scripts/sync_coaches.py'
      - 'data/coach-overrides.json'

permissions:
  contents: write

concurrency:
  group: football-data-refresh
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sync dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Build current football datapack
        run: python scripts/build_datapack.py

      - name: Merge live squad contracts and values
        continue-on-error: true
        run: python scripts/sync_live_squads.py

      - name: Refresh current coaches
        run: python scripts/sync_coaches.py

      - name: Validate generated data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['players.json','clubs-world.json','database-meta.json','coaches.json','transfers.json']:
              p=Path('data')/name
              if not p.exists(): raise SystemExit(f'Missing {p}')
              data=json.loads(p.read_text(encoding='utf-8'))
              if name=='coaches.json':
                  rows=data.get('records',[])
                  if not rows or any(not str(r.get('name','')).strip() for r in rows): raise SystemExit('Coach database contains missing names')
              print('OK',p)
          PY

      - name: Commit datapack
        shell: bash
        run: |
          git config user.name 'golaco-clash-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/players.json data/clubs-world.json data/database-meta.json data/coaches.json data/transfers.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update current football database [skip ci]'
          git push
