name: Update exchange rates

on:
  workflow_dispatch:
  schedule:
    - cron: '15 17 * * 1-5'

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ECB reference rates
        run: |
          python - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          url='https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml'
          req=urllib.request.Request(url,headers={'User-Agent':'ClubDynasty26/1.0'})
          raw=urllib.request.urlopen(req,timeout=30).read()
          root=ET.fromstring(raw)
          wanted={'USD','GBP','BRL'}
          values={'EUR':1.0}
          rate_date=None
          for elem in root.iter():
              if 'time' in elem.attrib: rate_date=elem.attrib['time']
              cur=elem.attrib.get('currency')
              if cur in wanted: values[cur]=float(elem.attrib['rate'])
          if not wanted.issubset(values): raise SystemExit(f'Missing rates: {wanted-set(values)}')
          out={'base':'EUR','date':rate_date or datetime.now(timezone.utc).date().isoformat(),'source':'European Central Bank reference rates','rates':values,'note':'Display conversion only. Club Dynasty 26 stores its internal economy in EUR to keep saves stable.'}
          with open('data/exchange-rates.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print(out)
          PY
      - name: Commit updated rates
        run: |
          git config user.name 'club-dynasty-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/exchange-rates.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update ECB exchange rates [skip ci]'
          git push
